        let dayOfWeek = document.getElementById('dayOfWeek');

        function showDay() {
            let day = Today.value;

                    dayOfWeek.innerHTML = `${day}`;
                break;
                case "Tuesday":
                    dayOfWeek.innerHTML = `${day}`;
                break;
                case "Wednesday":
                    dayOfWeek.innerHTML = `${day}`;
                break;
                case "Thursday":
                    dayOfWeek.innerHTML = `${day}`;
                break;
                case "Friday":
                    dayOfWeek.innerHTML = `${day}`;
                break;
                case "Saturday":
                    dayOfWeek.innerHTML = `Weekend`;
                break;
                case "Sunday":
                    dayOfWeek.innerHTML = `Weekend`;
                break;
                default:
                    dayOfWeek.innerHTML = `Please ${day} is not a valid day of the week`;
            }
