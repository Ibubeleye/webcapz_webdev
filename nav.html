<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            background-color: black;
            color: white;
            position:relative;
            top: 0;
            width: 100%;
            height: 60px;
            padding: 10px 50px;
        }
        ul{
            position: absolute;
            width: 300px;
        }
        ul li{
            list-style-type: none;
            display: inline-block;
        }
        nav{
            position: absolute;
            top: 20px;
            right: 200px;
        }
        a{
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
    
    <header>
        <h2>My Portfolio</h2>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./home.html">Contact</a></li>
                <li><a href="./anchor.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
