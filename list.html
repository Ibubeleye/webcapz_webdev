<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in CSS</title>
    
    <style>
        #home{
            list-style-image: url("./Multimedia/homeicon.png");
        }
        #about{
            list-style-image: url("./Multimedia/abouticon.png");
        }
        #contact{
            list-style-image: url("./Multimedia/contactpageicon.png");
        }
        #signin{
            list-style-image: url("./Multimedia/loginicon.png");
        }
        #signup{
            list-style-image: url("./Multimedia/signupicon.png");
        }
    </style>
</head>
<body>
    <ul>
        <li id="home">Home</li>
        <li id="about">About</li>
        <li id="contact">Contact Us</li>
        <li id="signin">Sign-in</li>
        <li id="signup">Sign-up</li>
    </ul>
</body>
</html>
