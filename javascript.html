<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h2 id="head" style="color: blue;">Welcome</h2>
    <button onclick="document.getElementById('head').innerHTML = 'Welcome User'">Click to change content</button>
    <button onclick="document.getElementById('head').innerHTML = 'Welcome'">Click to change again</button>
    <button ondblclick="document.getElementById('head').innerHTML = 'Welcome boy'">Double click to  change one more time</button>
    <button onclick="document.getElementById('head').style.color = 'red' ">Change color</button>


    <button onclick="document.getElementById('head').style.cssText = 'background-color: black; color: white; font-size: 3em;' ">Change CONTEXT</button>
    <input type="password" id="inp"> <button onclick="document.getElementById('inp').type = 'text' "><img src="./Multimedia/signupicon.png" alt=""></button>
    <!-- Using  it to validate forms -->


</body>
</html>
