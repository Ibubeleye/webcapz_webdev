<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            min-height: 80px;
            background-image: linear-gradient(90deg, black, blue);
            color: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        ul{
            display: flex;
            list-style-type: none;
        }
        header a{
            text-decoration: none;
            color: beige;
            padding: 10px;
            display: block;
        }
        header a:hover{
            color: black;
            border-bottom: 2px solid black;
        }
        img{
            width: 200px;
            height: 120px;
        }
        .logo{
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./Multimedia/logome2.PNG" alt="Company Logo">
            <h2>My Website</h2> 
        </div>
       
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Sign Up</a></li>
        </ul>
    </header>
</body>
</html>
