<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        .grid-container{
            display: grid;
            border: 3px solid;
            width: 350px;
            height: 500px;
            margin: 75px auto;
            grid-template-columns: repeat(4, 1fr);
            padding: 10px;
            gap: 7px;
            border-radius: 15px;
            background-color: rgb(180, 179, 179);
        }
        .grid-item{
            display: grid;
            border: 1px solid;
            text-align: center;
            align-items: center;
            border-radius: 15%;
            background-color: rgb(224, 224, 224);
        }
        .item1{
            grid-area: 1/1/2/5;
            border-radius: 10px;
            box-shadow: 4px 5px 7px  rgba(145, 141, 141, 0.418) inset;
        }
        .item20{
            grid-area: 6/3/7/5;
            border-radius: 10px;
        }
        .item2, .item3{
            background-color: red;
        }
        .item4, .item5, .item9, .item13, .item17, .item18, .item20{
            background-color: black;
            color: white;
        }
        .grid-item:not(.item1):hover{
            background-color: rgb(122, 104, 10);
        }
    </style>
</head>
<body>
    
    <div class="grid-container">
        <button class="grid-item item1"></button>
        <button class="grid-item item2" onclick="calc('AC')">AC</button>
        <button class="grid-item item3" onclick="calc('C')">C</button>
        <button class="grid-item item4" onclick="calc('%')">%</button>
        <button class="grid-item item5" onclick="calc('+')">+</button>
        <button class="grid-item item6" onclick="calc('7')">7</button>
        <button class="grid-item item7" onclick="calc('8')">8</button>
        <button class="grid-item item8" onclick="calc('9')">9</button>
        <button class="grid-item item9" onclick="calc('-')">-</button>
        <button class="grid-item item10" onclick="calc('4')">4</button>
        <button class="grid-item item11" onclick="calc('5')">5</button>
        <button class="grid-item item12" onclick="calc('6')">6</button>
        <button class="grid-item item13" onclick="calc('x')">x</button>
        <button class="grid-item item14" onclick="calc('1')">1</button>
        <button class="grid-item item15" onclick="calc('2')">2</button>
        <button class="grid-item item16" onclick="calc('3')">3</button>
        <button class="grid-item item17" onclick="calc('/')">/</button>
        <button class="grid-item item18" onclick="calc('.')">.</button>
        <button class="grid-item item19" onclick="calc('0')">0</button>
        <button class="grid-item item20" onclick="calc('=')">=</button>
    </div>

    <script>
        let display = document.querySelector('.item1');

        function calc(num){
            
            if(num == '='){
                display.innerHTML = eval(display.innerHTML);
                return; 
            }
            else if (num == 'AC' || num == 'C'){
                display.innerHTML = '';
                return;
            }
            else{
                display.innerHTML += num;
            }
        }
    </script>
</body>
</html>
