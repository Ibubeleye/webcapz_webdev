<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        h1{
            /* border-style: solid; */
            border-style: dashed;
            /* Shortcut */
            border-style: solid; /* all sides */
            border-style: solid dashed; /* |top and bottom|, |left and right| */
            border-style: solid dashed dotted; /* |top|, |left and right|, |bottom| */
            border-style: solid dashed dotted double; /* |top|, |left|, |right|, |bottom| */

            border-width: 8px 6px 4px 2px; /* |top|, |right|, |bottom|, |left| */

            border-color: red green blue pink; /* |top|, |right|, |bottom|, |left| */

            border: 3px solid lightblue; /* |width|, |style|, |color| */

            /* border-radius: 10px 20px 30px 40px; |top-left|, |top-right|, |bottom-right|, |bottom-left| */


            /* display: inline; */

            /* Make it a circle */
            height: 150px;
            width: 150px;
            /* border-radius: 50%; */

            text-align: center;
            padding: 20px 30px 40px 50px; /* |top|, |right|, |bottom|, |left| */
            
            margin: 20px 30px 40px 50px; /* |top|, |right|, |bottom|, |left| */
        }

        /* Margin Collapse */
        p{
            border: 1px solid;
            margin-top: 20px;
        }

        h3{
            width: 100px;
            border: 1px solid;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    
    <p>This is a simple example of the CSS box model.</p>

    <h1>Box Model</h1>

    <p>Paragraph</p>

    <h3>Heading 3</h3>
     
</body>
</html>
