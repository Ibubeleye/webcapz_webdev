<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor</title>

    <style>
        a:link{
            text-decoration: underline 3px dotted pink;
        }
        a:visited{
            text-decoration: underline 2px wavy red;
        }
        a:hover{
            text-decoration: underline 2px solid brown
        }
        a:active{
            text-decoration: underline 2px dashed green;
        }
    </style>
</head>
<body>
    <a href="https://www.google.com">Go to Google</a><br>
    <a href="https://www.github.com">Go to GitHub</a>
</body>
</html>
