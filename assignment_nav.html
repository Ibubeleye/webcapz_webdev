<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assognment Nav Bar</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        header{
            display: flex;
            min-height: 60px;
            width: 100%;
            background-image: linear-gradient(to right, blue, black);
            color: whitesmoke;
            justify-content: space-around;
            align-items: center;
            position: fixed;
        }
        
        nav > ul{
            list-style-type: none;
            display: flex;
        }

        nav a{
            padding: 10px;
            text-decoration: none;
            color: whitesmoke;
            display: block;
        }

        /* Small Phones - 480px */
        @media screen and (max-width: 480px) {
            header{
                padding: 8px;
            }
            nav > ul{
                flex-wrap: wrap;
                justify-content: center;
            }
            nav a{
                padding: 5px 8px;
                font-size: 14px;
            }
        }

        /* Medium screen / Tablets - 768px */
        @media screen and (min-width: 768px) {
            nav a {
                padding: 8px 12px;
                font-size: 15px;
            }
        }

    </style>
</head>
<body>
    <header>
        <h2>Ibubeleye</h2>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Sign Up</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
