<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="num"></div>


    <script>
        let num = document.getElementById("num");
        let nums = [1,3,5,30,70,70,];
        let nums2 = [2,3,1,5,4,8,6,7]
        let str = ['hello', 'world', 'javascript', 'html', 'css'];

        // console.log(nums);
        // console.log(nums.length);
        // console.log(str[3]);
        console.log(num);

        //Methods of array
        //1. push() - add element at the end of array
        console.log(nums.push(40));
        console.log(nums);
        
        //2. unshift() - add element at the beginning of array
        console.log(nums.unshift(0));
        console.log(nums);

        //3. pop() - remove element from the end of array
        console.log(nums.pop());
        console.log(nums);

        //4. shift() - remove element from the beginning of array
        console.log(nums.shift());
        console.log(nums);

        //5. sort() - sort the elements of an array
        console.log(nums2.sort());
        console.log(nums2);

        //6. reverse() - reverse the elements of an array
        // console.log(nums2.reverse());
        console.log(nums2);

        //7. splice() - add/remove elements from an array
        console.log(nums2.splice(2, 3));
        console.log(nums2);

        let fruits = ['apple', 'banana', 'orange',   'mango'];
        console.log(fruits.splice(2, 1, 'kiwi', 'pear'));
         
        fruits.splice(1, 2, 'strawberry', 'blueberry'); // remove 2 elements from index 1 and add 2 new elements
        console.log(fruits);

        //8. slice() - return a new array with selected elements
        //Syntax: array.slice(start, end) - end is optional
        let fruits2 = ['apple', 'banana', 'orange', 'mango'];
        let newFruits = fruits2.slice(1, 3); // return elements from index 1 to 2 and remove the rest while avoiding 3
        console.log(newFruits);
        
        //9. split() - split a string into an array of substrings
        let str2 = "Hello";
        let newStr = str2.split(""); // split the string into an array of characters
        console.log(newStr);
        console.log(newStr[4]);

        //10. join() - join the elements of an array into a string
        let joinedStr = newStr.join(",") //You can also use a separator like newStr.join("-") to join the elements with a hyphen or any other character of your choice like space or comma.
        console.log(joinedStr);

        //11. concat() - merge two or more arrays
        let num4 = [1, 2, 3];
        let num5 = [4, 5, 6];
        let newNum = num4.concat(num5);
        console.log(newNum);

    </script>
</body>
</html>
