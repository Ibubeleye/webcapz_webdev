<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>

    <style>
        /* Declaring variables */
        :root{
            --ccolorforbg: #311d1d;
        }
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            min-height: 300px;
            border: 1px solid;
            display: grid;
            grid-template-columns: auto;
            background-color: var(--ccolorforbg);   /* Use of declared variables */
        }
        .items{
            border: 1px solid;
        }

        /* Small Phones - 480px */
        @media screen and (max-width: 480px) {
            .container {
                grid-template-columns: auto;
            }
        }

        /* Medium screen / Tablets - 768px */
        @media screen and (min-width: 768px) {
            .container{
                grid-template-columns: auto auto;
            }
        }

        /* Laptops - 1024px */
        @media screen and (min-width: 1024px) {
            .container {
                grid-template-columns: auto auto auto;
            }
        }

        /* Large screen -1200px */
        @media screen and (min-width: 1200px) {
           .container{
                grid-template-columns: auto auto auto auto;
           } 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
    </div>
</body>
</html>
